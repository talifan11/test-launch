[package]
name = "valheim-launcher-v2"
version = "0.1.0"
description = "Valheim Rouge Launcher v2"
authors = ["talifan11"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
zip = "8"
tokio = { version = "1", features = ["full"] }

[lib]
name = "valheim_launcher_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
